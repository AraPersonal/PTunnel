name: images
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: panel
            context: apps/panel
          - name: xray
            context: infra/docker/xray
    steps:
      - uses: actions/checkout@v4
      # Container registry references must be lowercase. github.repository keeps the owner's casing,
      # so ghcr.io/AraPersonal/PTunnel was rejected outright - both image builds failed on this alone.
      - name: lowercase image prefix and tag
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "REF_TAG=${GITHUB_REF_NAME,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            XRAY_VERSION=${{ vars.XRAY_VERSION != '' && vars.XRAY_VERSION || '26.10.29' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ env.REF_TAG }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
