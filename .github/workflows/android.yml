name: android
on:
  pull_request:
    paths: ["apps/android/**"]
  push:
    branches: [main]
    paths: ["apps/android/**"]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/android/**/*.gradle*
      # The wrapper is committed from Windows, where the executable bit does not survive; without this
      # the job dies with "Permission denied" before running anything.
      - name: make the wrapper executable
        run: chmod +x gradlew
      - name: download libv2ray core
        run: |
          mkdir -p app/libs
          curl -fSLk --retry 3 --retry-delay 2 -o app/libs/libv2ray.aar https://86-54-42-124.nip.io/dl/libv2ray.aar || \
          curl -fSLk --retry 3 --retry-delay 2 -o app/libs/libv2ray.aar https://38-17-64-159.nip.io/dl/libv2ray.aar
          ls -lh app/libs/libv2ray.aar
      - name: unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: prepare release keystore
        if: ${{ env.RELEASE_KEYSTORE != '' }}
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE" | base64 -d > app/release.jks
      - name: assemble APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/apps/android/app/release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f app/release.jks ]; then
            ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug
          else
            ./gradlew --no-daemon :app:assembleDebug
          fi
      - name: report test counts
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          t = f = 0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              m = re.search(r'tests="(\d+)"[^>]*failures="(\d+)"[^>]*errors="(\d+)"', open(p, encoding='utf-8').read())
              if m:
                  t += int(m.group(1)); f += int(m.group(2)) + int(m.group(3))
          print(f'unit tests: {t} run, {f} failed')
          PY
      - name: upload release APK
        if: ${{ hashFiles('apps/android/app/build/outputs/apk/release/app-release.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ptunnel-release-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 14
      - name: upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ptunnel-debug-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
