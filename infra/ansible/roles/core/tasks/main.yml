---
- name: directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    mode: "0755"
  loop:
    - "{{ ptunnel_root }}"
    - "{{ ptunnel_root }}/config"
    - "{{ ptunnel_root }}/backups"

- name: persistent data directory for panel sqlite db
  ansible.builtin.file:
    path: "{{ ptunnel_root }}/data"
    state: directory
    mode: "0777"

- name: compose file from the repo, never edited on the box
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../docker/compose.yml"
    dest: "{{ ptunnel_root }}/compose.yml"
    mode: "0644"

- name: core config
  ansible.builtin.template:
    src: xray.json.j2
    dest: "{{ ptunnel_root }}/config/xray.json"
    mode: "0640"
    backup: true
  notify: restart core

- name: deploy script
  ansible.builtin.template:
    src: deploy.sh.j2
    dest: "{{ ptunnel_root }}/deploy.sh"
    mode: "0755"

- name: registry login
  community.docker.docker_login:
    registry: ghcr.io
    username: x-access-token
    password: "{{ vault_ghcr_token }}"
    reauthorize: true
  no_log: true
  when: vault_ghcr_token | default('') | length > 0

- name: pull images and converge the stack
  ansible.builtin.command:
    cmd: "./deploy.sh {{ pt_env }} {{ ptunnel_image_tag }} {{ ptunnel_image_repo }}"
    chdir: "{{ ptunnel_root }}"
  register: deploy
  changed_when: deploy.rc == 0

- name: certificate directory
  ansible.builtin.file:
    path: "{{ ptunnel_root }}/config/certs"
    state: directory
    mode: "0750"

- name: self-signed certificate for the QUIC listener
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -days 365 -nodes
      -keyout {{ ptunnel_root }}/config/certs/privkey.pem
      -out {{ ptunnel_root }}/config/certs/fullchain.pem
      -subj /CN={{ public_host }}
    creates: "{{ ptunnel_root }}/config/certs/fullchain.pem"
  when: hy2_tls_mode == "selfsigned"

- name: hysteria config
  ansible.builtin.template:
    src: hysteria.yaml.j2
    dest: "{{ ptunnel_root }}/config/hysteria.yaml"
    mode: "0640"
    backup: true
  notify: restart hysteria
